<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc"><title id="title">보이스피싱 예방 시안 포스터</title><desc id="desc">의심스러운 전화는 끊고 공식 번호로 다시 확인하라는 안내</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102c4a"/><stop offset="1" stop-color="#28799a"/></linearGradient></defs><rect width="900" height="430" rx="26" fill="url(#bg)"/><circle cx="760" cy="220" r="135" fill="#ffffff" opacity=".08"/><path d="M700 125h120a22 22 0 0 1 22 22v135a22 22 0 0 1-22 22H700a22 22 0 0 1-22-22V147a22 22 0 0 1 22-22Z" fill="#fff" opacity=".95"/><path d="M742 178c7-8 19-6 25 2l13 17c5 7 3 17-4 22l-11 8c10 21 26 37 47 47l8-11c5-7 15-9 22-4l17 13c8 6 10 18 2 25-11 11-27 15-42 9-47-18-84-55-102-102-6-15-2-31 9-42Z" transform="translate(-36 -24) scale(.8)" fill="#28799a"/><text x="62" y="85" fill="#bfeaf0" font-family="sans-serif" font-size="22" font-weight="700" letter-spacing="4">CITIZEN SAFETY · SAMPLE</text><text x="62" y="185" fill="#fff" font-family="sans-serif" font-size="48" font-weight="800">의심스러운 전화는</text><text x="62" y="250" fill="#fff" font-family="sans-serif" font-size="48" font-weight="800">끊고, 다시 확인하세요</text><text x="62" y="318" fill="#d7edf2" font-family="sans-serif" font-size="25">공식 기관의 대표번호로 직접 확인하세요.</text><text x="62" y="382" fill="#bfeaf0" font-family="sans-serif" font-size="18">※ 시안용 안내 이미지 · 실제 자료로 교체 예정</text></svg>
