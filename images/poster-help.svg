<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc"><title id="title">긴급 신고 안내 시안 포스터</title><desc id="desc">긴급한 범죄나 사고는 112에 신고하라는 안내</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#523d70"/><stop offset="1" stop-color="#9673a8"/></linearGradient></defs><rect width="900" height="430" rx="26" fill="url(#bg)"/><circle cx="744" cy="215" r="142" fill="#fff" opacity=".1"/><circle cx="744" cy="215" r="94" fill="#fff" opacity=".95"/><path d="M711 156h52l15 17v95h-82v-95z" fill="#7b5c91"/><path d="M725 196h24M725 215h24M725 234h24" stroke="#fff" stroke-width="8" stroke-linecap="round"/><text x="62" y="85" fill="#e9ddf2" font-family="sans-serif" font-size="22" font-weight="700" letter-spacing="4">EMERGENCY · SAMPLE</text><text x="62" y="185" fill="#fff" font-family="sans-serif" font-size="48" font-weight="800">긴급한 범죄·사고</text><text x="62" y="250" fill="#fff" font-family="sans-serif" font-size="48" font-weight="800">신고는 112</text><text x="62" y="318" fill="#f0e9f5" font-family="sans-serif" font-size="25">위급한 상황에서는 112로 신고하세요.</text><text x="62" y="382" fill="#e9ddf2" font-family="sans-serif" font-size="18">※ 시안용 안내 이미지 · 실제 자료로 교체 예정</text></svg>
