<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc"><title id="title">보행자 교통안전 시안 포스터</title><desc id="desc">길을 건널 때 멈추고 살핀 뒤 건너라는 안내</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#174e5d"/><stop offset="1" stop-color="#53a89c"/></linearGradient></defs><rect width="900" height="430" rx="26" fill="url(#bg)"/><circle cx="744" cy="208" r="145" fill="#fff" opacity=".12"/><rect x="677" y="94" width="112" height="238" rx="30" fill="#fff" opacity=".96"/><circle cx="733" cy="151" r="24" fill="#f07565"/><circle cx="733" cy="213" r="24" fill="#f3c653"/><circle cx="733" cy="275" r="24" fill="#58b788"/><text x="62" y="85" fill="#d0f3e9" font-family="sans-serif" font-size="22" font-weight="700" letter-spacing="4">TRAFFIC SAFETY · SAMPLE</text><text x="62" y="185" fill="#fff" font-family="sans-serif" font-size="48" font-weight="800">멈추고, 살피고,</text><text x="62" y="250" fill="#fff" font-family="sans-serif" font-size="48" font-weight="800">안전하게 건너요</text><text x="62" y="318" fill="#e2f5ef" font-family="sans-serif" font-size="25">횡단보도에서는 좌우를 살핀 뒤 이동하세요.</text><text x="62" y="382" fill="#d0f3e9" font-family="sans-serif" font-size="18">※ 시안용 안내 이미지 · 실제 자료로 교체 예정</text></svg>
